workflow:
  id: story-creation
  name: Story Creation Workflow
  version: 1.0.0
  description: Create compelling narratives using storytelling frameworks
  type: legacy
  sequence:
    - step: analysis
      id: analysis
      phase: 1
      phase_name: Story Analysis
      agent: joseph-campbell
      action: execute_story-analysis
      outputs:
        - story_type
        - recommended_framework
        - narrative_analysis
      next: structure
    - step: structure
      id: structure
      phase: 2
      phase_name: Structure Design
      agent: aiox-master
      action: execute_structure-design
      outputs:
        - story_structure
        - beat_sheet
        - character_map
      next: enhancement
    - step: enhancement
      id: enhancement
      phase: 3
      phase_name: Enhancement
      agent: aiox-master
      action: execute_enhancement
      outputs:
        - enhanced_story
        - technique_notes
      next: validation
    - step: validation
      id: validation
      phase: 4
      phase_name: Story Validation
      agent: aiox-master
      action: execute_story-validation
      next: delivery
    - step: delivery
      id: delivery
      phase: 5
      phase_name: Final Story
      agent: aiox-master
      action: execute_final-story
      outputs:
        - final_narrative
        - framework_attribution
        - usage_notes
    - workflow_end:
        id: complete
        action: workflow_complete
  handoff_prompts:
    joseph-campbell_to_aiox-master: Handoff context from joseph-campbell to aiox-master. Preserve outputs, risks, and open decisions.
phases:
  - id: analysis
    name: Story Analysis
    tier: 0
    agents:
      - joseph-campbell
      - shawn-coyne
    actions:
      - Identify story type/genre
      - Assess narrative potential
      - Determine best framework
    outputs:
      - story_type
      - recommended_framework
      - narrative_analysis
  - id: structure
    name: Structure Design
    tier: 1
    depends_on: analysis
    framework_selection:
      marketing: donald-miller (StoryBrand)
      presentation: nancy-duarte (Sparkline)
      episodic: dan-harmon (Story Circle)
      screenplay: blake-snyder (Save the Cat)
    actions:
      - Apply selected framework
      - Define story beats
      - Map character arcs
    outputs:
      - story_structure
      - beat_sheet
      - character_map
  - id: enhancement
    name: Enhancement
    tier: 2
    depends_on: structure
    optional_specialists:
      pitch: oren-klaff
      business: kindra-hall
      personal: matthew-dicks
      leadership: marshall-ganz
      brand: park-howell
      improv: keith-johnstone
    actions:
      - Add specialized techniques
      - Enhance emotional beats
      - Polish narrative flow
    outputs:
      - enhanced_story
      - technique_notes
  - id: validation
    name: Story Validation
    depends_on: enhancement
    actions:
      - Check story coherence
      - Validate emotional arc
      - Ensure message clarity
    checkpoint:
      question: Story ready for delivery?
      requires_approval: true
  - id: delivery
    name: Final Story
    depends_on: validation
    outputs:
      - final_narrative
      - framework_attribution
      - usage_notes
