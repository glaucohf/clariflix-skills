# Storytelling Squad Configuration
# Elite Storytelling Minds for Narrative Excellence

pack:
  name: storytelling
  title: "Storytelling - Elite Narrative Squad"
  version: "1.0.0"
  author: "AIOX Team"
  description: "Time de mestres em storytelling organizados para criar narrativas poderosas"
  icon: "📖"
  slash_prefix: "story"

# ═══════════════════════════════════════════════════════════════════════════════
# ORCHESTRATOR
# ═══════════════════════════════════════════════════════════════════════════════
orchestrator:
  agent: "story-chief"
  activation: "@story"

# ═══════════════════════════════════════════════════════════════════════════════
# AGENTS - Elite Storytelling Minds
# ═══════════════════════════════════════════════════════════════════════════════
agents:
  # Tier 0 - Foundational (Diagnostic/Framework Creators)
  - id: joseph-campbell
    name: "Joseph Campbell"
    specialty: "Hero's Journey, Monomyth"
    tier: 0
    framework: "The Hero with a Thousand Faces"

  - id: shawn-coyne
    name: "Shawn Coyne"
    specialty: "Story Grid, Genre Analysis"
    tier: 0
    framework: "The Story Grid"

  # Tier 1 - Masters (Proven Methodologies)
  - id: donald-miller
    name: "Donald Miller"
    specialty: "StoryBrand, Business Narrative"
    tier: 1
    framework: "Building a StoryBrand (SB7)"

  - id: nancy-duarte
    name: "Nancy Duarte"
    specialty: "Presentation Storytelling"
    tier: 1
    framework: "Resonate, Sparkline"

  - id: dan-harmon
    name: "Dan Harmon"
    specialty: "Story Circle, TV Writing"
    tier: 1
    framework: "Story Circle (8 beats)"

  - id: blake-snyder
    name: "Blake Snyder"
    specialty: "Screenwriting Structure"
    tier: 1
    framework: "Save the Cat (15 beats)"

  # Tier 2 - Specialists
  - id: oren-klaff
    name: "Oren Klaff"
    specialty: "Pitch Storytelling, Neurofinance"
    tier: 2
    framework: "Pitch Anything (STRONG method)"

  - id: kindra-hall
    name: "Kindra Hall"
    specialty: "Strategic Storytelling, Business"
    tier: 2
    framework: "Stories That Stick"

  - id: matthew-dicks
    name: "Matthew Dicks"
    specialty: "Personal Storytelling, Moth"
    tier: 2
    framework: "Storyworthy"

  - id: marshall-ganz
    name: "Marshall Ganz"
    specialty: "Public Narrative, Leadership"
    tier: 2
    framework: "Story of Self, Us, Now"

  - id: park-howell
    name: "Park Howell"
    specialty: "Brand Storytelling"
    tier: 2
    framework: "Business of Story (ABT)"

  - id: keith-johnstone
    name: "Keith Johnstone"
    specialty: "Improvisational Storytelling"
    tier: 2
    framework: "Impro, Status Theory"

# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════════════════
dependencies:
  required: []
  optional:
    - name: copy
      reason: "Integration with copywriting for sales narratives"
    - name: mmos
      reason: "Clone additional storytelling minds"

# ═══════════════════════════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════════════════════════
metadata:
  version: "1.0.0"
  score: 7.4
  category: content-creation
  complexity: intermediate
  created: "2026-01-29"
  last_updated: "2026-02-01"

settings:
  activation:
    show_context_report: true
    show_preload_report: true
    show_quick_commands: true
    quick_commands_limit: 6
  preload:
    max_shared_files: 3
    max_product_files: 4

workspace_integration:
  level: controlled_runtime_consumer
  rationale: >-
    Storytelling depende de contexto canônico de ICP, brand, positioning,
    offerbook, proof e pricing para criar narrativas de negócio consistentes,
    mas o output principal continua sendo narrativo e não define namespace
    próprio em workspace. O COO resolve readiness e o squad consome esse
    contrato antes de output final.
  read_paths:
    - workspace/config.yaml
    - workspace/businesses/
    - workspace/_templates/product-narrative/
  write_paths: []
  readiness_owner: workspace-chief
  readiness_resolver: squads/aiox-workspace/scripts/resolve-squad-workspace-readiness.cjs

# ═══════════════════════════════════════════════════════════════════════════════
# DATA
# ═══════════════════════════════════════════════════════════════════════════════
data:
  - id: story-mappings
    name: "Story Mappings — Canonical Vocabulary"
    format: yaml
    description: "Translates vague narrative requests into professional storytelling terminology. 4 tables: narrative_terms, framework_selector, story_elements, audience_context."
