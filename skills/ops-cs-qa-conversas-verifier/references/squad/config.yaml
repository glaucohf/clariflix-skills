tasks:
  - scanner-de-dados-sensiveis.md
  - avaliar-qualidade-relacional.md
  - verificar-informacoes-tecnicas.md
  - avaliar-resolucao-problema.md
  - gerar-scorecard-completo.md
  - calibrar-rubrica.md
