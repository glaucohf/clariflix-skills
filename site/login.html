<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessar o ClariFlix</title>
<style>
:root{--bg:#14120f;--panel:#1e1b16;--ink:#f1ede4;--dim:#9c9587;--line:rgba(241,237,228,.2);--accent:#5fbe9e;--danger:#e5666b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,rgba(95,190,158,.14),transparent 40%),var(--bg);color:var(--ink)}main{width:min(100%,420px);padding:34px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.28)}.wordmark{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent);display:block;margin-bottom:30px}.wordmark b{color:var(--ink)}h1{font:600 26px ui-monospace,monospace;margin:0 0 10px}p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 22px}form{display:grid;gap:10px}label{font:12px ui-monospace,monospace;color:var(--dim)}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:6px;background:#0f0d0a;color:var(--ink);font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,190,158,.14)}button{margin-top:6px;border:0;border-radius:6px;padding:12px;background:var(--accent);color:#0d1512;font:600 13px ui-monospace,monospace;cursor:pointer}.error{min-height:1.4em;margin:2px 0 0;color:var(--danger);font:12px ui-monospace,monospace}
</style>
</head>
<body>
<main>
  <span class="wordmark">CLARI<b>FLIX</b></span>
  <h1>Acessar o ClariFlix</h1>
  <p>Digite a senha para abrir o catálogo de skills.</p>
  <form id="loginForm">
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Acessar</button>
    <div class="error" id="error" aria-live="polite"></div>
  </form>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(event){
  event.preventDefault();
  const password = document.getElementById("password");
  const error = document.getElementById("error");
  const response = await fetch("/auth/login", {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:password.value})});
  if(response.ok){ window.location.assign("/"); return; }
  error.textContent = "Acesso negado.";
  password.select();
});
</script>
</body>
</html>
