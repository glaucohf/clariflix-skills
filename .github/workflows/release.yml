name: Release skill packages
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_catalog.py --tag "$GITHUB_REF_NAME"
      - run: python scripts/build_distribution.py
      - name: Publish complete skill archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "ClariFlix $GITHUB_REF_NAME" --generate-notes
