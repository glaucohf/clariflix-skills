name: Validate skills and distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_catalog.py
      - run: python scripts/build_distribution.py
      - run: git diff --exit-code -- catalog.json site/catalog.json docs/catalog.json docs/prompt docs/.nojekyll
